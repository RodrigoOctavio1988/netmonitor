<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filtros de Brilho Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 800; }
    .font-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 400; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Fundo -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" fill="url(#glowEmerald)"/>

  <!-- Grade Cibernética -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Conexões de Topologia Decorativas (Lado Direito) -->
  <g filter="url(#neonGlow)">
    <path d="M 680,240 C 760,180 820,130 920,130" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
    <path d="M 920,130 C 1000,130 1040,190 1100,190" fill="none" stroke="url(#lineGrad)" stroke-width="2.5"/>
    <path d="M 920,130 C 960,200 1000,270 1060,280" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 680,240 C 740,290 820,330 900,320" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M 900,320 C 970,310 1030,340 1080,350" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <!-- Cards de Nós da Topologia (Lado Direito) -->
  <!-- Nó Gateway -->
  <g transform="translate(620, 200)" filter="url(#softShadow)">
    <rect width="130" height="60" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#38bdf8"/>
    <text x="38" y="28" fill="#f8fafc" class="font-title" font-size="13">Gateway</text>
    <text x="38" y="44" fill="#94a3b8" class="font-mono" font-size="10">192.168.1.1</text>
    <circle cx="112" cy="24" r="4" fill="#10b981"/>
  </g>

  <!-- Nó Switch Central -->
  <g transform="translate(860, 95)" filter="url(#softShadow)">
    <rect width="130" height="60" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#10b981"/>
    <text x="38" y="28" fill="#f8fafc" class="font-title" font-size="13">Switch Core</text>
    <text x="38" y="44" fill="#94a3b8" class="font-mono" font-size="10">192.168.1.2</text>
    <circle cx="112" cy="24" r="4" fill="#10b981"/>
  </g>

  <!-- Nó Servidor -->
  <g transform="translate(1040, 160)" filter="url(#softShadow)">
    <rect width="125" height="55" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2"/>
    <text x="20" y="26" fill="#f8fafc" class="font-title" font-size="12">Servidor DB</text>
    <text x="20" y="42" fill="#94a3b8" class="font-mono" font-size="9">192.168.1.10</text>
    <circle cx="106" cy="22" r="3.5" fill="#10b981"/>
  </g>

  <!-- Nó WiFi / AP -->
  <g transform="translate(840, 290)" filter="url(#softShadow)">
    <rect width="125" height="55" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="20" y="26" fill="#f8fafc" class="font-title" font-size="12">Access Point</text>
    <text x="20" y="42" fill="#94a3b8" class="font-mono" font-size="9">192.168.1.50</text>
    <circle cx="106" cy="22" r="3.5" fill="#10b981"/>
  </g>

  <!-- Conteúdo Principal e Branding (Lado Esquerdo) -->
  <!-- Badge Superior -->
  <g transform="translate(80, 75)">
    <rect width="210" height="30" rx="15" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
    <text x="28" y="20" fill="#38bdf8" class="font-mono" font-size="11" font-weight="bold">v3.0.0 • OPEN SOURCE</text>
  </g>

  <!-- Título com Gradiente Neon -->
  <text x="80" y="170" fill="url(#titleGrad)" class="font-title" font-size="64" letter-spacing="-1">
    NetMonitor
  </text>

  <!-- Subtítulo -->
  <text x="82" y="215" fill="#cbd5e1" class="font-subtitle" font-size="20">
    Monitoramento de Rede em Tempo Real &amp; Topologia SVG Interativa
  </text>
  <text x="82" y="242" fill="#64748b" class="font-subtitle" font-size="14">
    Varredura paralela ICMP, WebSocket contínuo, limites de latência e SQLite VACUUM.
  </text>

  <!-- Badges de Recursos -->
  <g transform="translate(82, 280)">
    <!-- Badge 1: Topologia -->
    <g transform="translate(0, 0)">
      <rect width="130" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="14" y="20" fill="#38bdf8" class="font-mono" font-size="11" font-weight="600">⚡ Topologia SVG</text>
    </g>

    <!-- Badge 2: WebSocket -->
    <g transform="translate(142, 0)">
      <rect width="135" height="32" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="14" y="20" fill="#34d399" class="font-mono" font-size="11" font-weight="600">📡 WebSocket Live</text>
    </g>

    <!-- Badge 3: SQLite -->
    <g transform="translate(289, 0)">
      <rect width="115" height="32" rx="8" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.3"/>
      <text x="14" y="20" fill="#a5b4fc" class="font-mono" font-size="11" font-weight="600">🗄️ SQLite Purge</text>
    </g>

    <!-- Badge 4: Docker -->
    <g transform="translate(416, 0)">
      <rect width="105" height="32" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="14" y="20" fill="#7dd3fc" class="font-mono" font-size="11" font-weight="600">🐳 Docker Ready</text>
    </g>
  </g>

  <!-- Rodapé do Banner -->
  <text x="82" y="365" fill="#475569" class="font-mono" font-size="12">
    Criado por Rodrigo Octávio E. de Oliveira • Automação com GitHub Actions CI/CD
  </text>
</svg>
